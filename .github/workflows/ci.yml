name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, lint, unit tests: the original job, plus the checks that kept drifting.
  js:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Typecheck (web, mobile, shared)
        run: npm run typecheck

      # Fails on errors only. ~90 warnings are tolerated today (no-explicit-any,
      # exhaustive-deps, cross-feature imports); burn them down, then add --max-warnings.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # supabase/functions/_shared/runEngine.ts is generated from the shared engine
      # (postinstall runs the generator) and must never be committed.
      - name: Engine copy is generated, not committed
        run: |
          if [ -n "$(git ls-files supabase/functions/_shared/runEngine.ts)" ]; then
            echo "::error::supabase/functions/_shared/runEngine.ts is tracked. It is generated: git rm --cached it."
            exit 1
          fi
          npm run engine:check

      - name: Migration lint
        run: node scripts/lint-migrations.mjs

      # Advisory until the known transitive findings are cleared; then drop `|| true`.
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high || true

  # Type-checks the edge functions (they are Deno, which tsc cannot see) and runs the
  # helper tests that use Deno APIs.
  deno:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The functions import _shared/runEngine.ts, which is generated and not in git.
      - name: Generate engine copy
        run: node scripts/sync-engine.mjs
      - name: Check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check --node-modules-dir=none "$f"
          done

  # Applies every migration to a PostGIS Postgres (with a stand-in for Supabase's auth,
  # storage and cron schemas, see supabase/tests/_supabase_base.sql) and runs supabase/tests.
  # Needs no Supabase CLI. It passes all 57 tests, so it blocks the merge.
  sql:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # Includes function_privileges.test.sql, which fails if a server-only function
      # becomes callable by clients.
      - name: Tests
        run: supabase/tests/run.sh

  # Scans the commits in a pull request. History before this was added is not rescanned
  # (an old service key lives there; it is handled by rotating it, not by this check).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
